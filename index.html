<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141b26">
  <title>God Sim</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>

  <header id="topbar">
    <div class="row">
      <span id="date">Day 1</span>
      <span id="pop">Pop 0</span>
    </div>
    <div id="stock">Wood 0 · Stone 0</div>
    <div class="row">
      <div class="group">
        <button data-speed="0" aria-label="Pause">II</button>
        <button data-speed="1">1x</button>
        <button data-speed="2">2x</button>
        <button data-speed="4">4x</button>
      </div>
      <div class="group">
        <button id="btn-log">Log</button>
        <button id="btn-tribe">Tribe</button>
        <button id="btn-menu" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <nav id="powers">
    <div id="power-hint" class="hidden"></div>
    <div id="power-buttons"></div>
  </nav>

  <section id="inspect" class="panel hidden">
    <div class="panel-head">
      <div>
        <h2 id="insp-name"></h2>
        <div id="insp-hero" class="hero-line"></div>
        <div id="insp-leader" class="leader-line"></div>
        <div class="sub"><span id="insp-age"></span> · <span id="insp-action"></span></div>
      </div>
      <button id="inspect-close" aria-label="Close">✕</button>
    </div>
    <div class="chips"><span id="insp-emotion-row"></span><span id="insp-traits" class="chips inline"></span></div>
    <div id="insp-tools" class="sub"></div>
    <div id="insp-alive">
      <div id="insp-level"></div>
      <div id="insp-stats" class="stats-grid"></div>
      <div class="need"><label>Health</label><div class="bar"><div id="bar-health"></div></div></div>
      <div class="need"><label>Food</label><div class="bar"><div id="bar-hunger"></div></div></div>
      <div class="need"><label>Energy</label><div class="bar"><div id="bar-energy"></div></div></div>
      <div class="need"><label>Social</label><div class="bar"><div id="bar-social"></div></div></div>
      <div class="need"><label>Mood</label><div class="bar"><div id="bar-mood"></div></div></div>
      <div class="need"><label>Devotion</label><div class="bar devotion"><div id="bar-devotion"></div></div></div>
      <h3>Thoughts</h3>
      <div id="insp-thoughts"></div>
      <h3>Relationships</h3>
      <div id="insp-bonds"></div>
      <h3>Skills</h3>
      <div id="insp-skills"></div>
    </div>
    <h3>Knows</h3>
    <div id="insp-knows" class="chips"></div>
  </section>

  <section id="log" class="panel hidden">
    <div class="panel-head">
      <h2>History</h2>
      <button id="log-close" aria-label="Close">✕</button>
    </div>
    <ol id="log-list"></ol>
  </section>

  <section id="tribe" class="panel hidden">
    <div class="panel-head">
      <div>
        <h2 id="tribe-title"></h2>
        <div id="tribe-sub" class="sub"></div>
      </div>
      <button id="tribe-close" aria-label="Close">✕</button>
    </div>
    <div class="tabs">
      <button data-tab="overview">Overview</button>
      <button data-tab="people">People</button>
      <button data-tab="items">Items</button>
      <button data-tab="tech">Tech</button>
    </div>
    <div id="tribe-body"></div>
  </section>

  <section id="omen" class="panel hidden">
    <div class="panel-head">
      <div>
        <h2>Send an omen</h2>
        <div class="sub">30 Faith. The whole tribe follows its calling for 10 days.</div>
      </div>
      <button id="omen-close" aria-label="Close">✕</button>
    </div>
    <div id="omen-list"></div>
  </section>

  <section id="portal" class="panel hidden">
    <div class="panel-head">
      <div>
        <h2>The Portal</h2>
        <div id="portal-sub" class="sub"></div>
      </div>
      <button id="portal-close" aria-label="Close">✕</button>
    </div>
    <div id="portal-body"></div>
  </section>

  <section id="menu" class="panel hidden">
    <div class="panel-head">
      <h2>Game</h2>
      <button id="menu-close" aria-label="Close">✕</button>
    </div>
    <button id="btn-save" class="wide">Save game</button>
    <button id="btn-load" class="wide">Load saved game</button>
  </section>

  <div id="toast"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
